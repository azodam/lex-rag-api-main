services:
  lex-rag-api:
    build:
      context: .
    environment:
      RAG_API_KEY: "${RAG_API_KEY:?Set RAG_API_KEY in .env}"
      RAG_DB: /app-data/rag.sqlite3
      RAG_CORPUS: /app/data/lex.jsonl
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - rag-data:/app-data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  rag-data:
